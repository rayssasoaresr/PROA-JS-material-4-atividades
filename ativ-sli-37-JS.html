<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>While</title>
</head>
<body>
    <h2>While</h2>

    <script>
        console.log("a) contar 1 a 20");
        let a = 1;
        while (a <= 20) {
            console.log(a);
            a++;
        }

        console.log(" ");
        console.log("b) Soma de 1 a 10");
        let b = 1;
        let soma = 0;
        while (b <= 10) {
            soma += b;
            b++;
        }
        console.log("Resultado:", soma);

        console.log(" ");
        console.log("c) Contagem regressiva de 10 a 1");
        let c = 10;
        while (c >= 1) {
            console.log(c);
            c--;
        }
    </script>
</body>
</html>
