<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loops</title>
</head>
<body>
    <h2>Loops</h2>

    <script>
        console.log("a) Contar de 1 a 16");
        for (let i = 1; i <= 16; i++) {
            console.log(i);
        }

        console.log(" ");
        console.log("b) 10 a 1 (decrescente)");
        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }

        console.log(" ");
        console.log("c) Números pares de 2 a 20");
        for (let i = 2; i <= 20; i += 2) {
            console.log(i);
        }
    </script>
</body>
</html>
