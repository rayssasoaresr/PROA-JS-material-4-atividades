<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Soma dos números</title>
</head>
<body>
    <h2>Soma dos Números</h2>

    <script>
        let somaA = 0;
        for (let i = 1; i <= 50; i++) {
            somaA += i;
        }
        console.log("a) Soma de 1 a 50:", somaA);

        console.log(" ");

        let somaB = 0;
        for (let i = 2; i <= 100; i += 2) {
            somaB += i;
        }
        console.log("b) Soma dos pares de 2 a 100:", somaB);
    </script>
</body>
</html>
