<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do-While</title>
</head>
<body>
    
    <script>
        let i = 1;

do {
    console.log("Número:", i);
    i++;
} while (i <= 5);
    </script>
</body>
</html>
